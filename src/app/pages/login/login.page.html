<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title font-family="Arial, sans-serif" class="ion-text-center">Login</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <!--Logo Container-->
      <div class="logo-container">
      <div class="logo-circle">
        <ion-icon src="assets/icon/akdav.svg"></ion-icon>
      </div>

      <h1 class="app-name">AKDAV</h1>

      <p class="app-description">
        App de Kiosko, Desayunos y Alimentos Varios
      </p>
    </div>
<div class="form-container">

      <!-- USUARIO -->
      <ion-item class="input-item" lines="none">
        <ion-icon
          src="assets/icon/person-outline.svg"
          slot="start"
          color="primary">
        </ion-icon>

        <ion-input
          label="Usuario"
          labelPlacement="floating"
          placeholder="Ingresa tu usuario"
          [(ngModel)]="usuario">
        </ion-input>
      </ion-item>

      <!-- CONTRASEÑA -->
      <ion-item class="input-item" lines="none">
        <ion-icon
          src="assets/icon/lock-closed-outline.svg"
          slot="start"
          color="primary">
        </ion-icon>

        <ion-input
          label="Contraseña"
          labelPlacement="floating"
          placeholder="Ingresa tu contraseña"
          [type]="mostrarPassword ? 'text' : 'password'"
          [(ngModel)]="password">
        </ion-input>

        <ion-button
          fill="clear"
          slot="end"
          (click)="mostrarPassword = !mostrarPassword">

          <ion-icon
            [src]="mostrarPassword ? 'assets/icon/eye-off-outline.svg' : 'assets/icon/eye-outline.svg'">
          </ion-icon>

        </ion-button>
      </ion-item>

      <!-- BOTÓN INICIAR SESIÓN -->
      <ion-button
        expand="block"
        class="login-button"
        (click)="iniciarSesion()">

        Iniciar sesión

      </ion-button>

      <!-- REGISTRO -->
      <div class="register-container">

        <p>¿No tienes una cuenta?</p>

        <ion-button
          fill="clear"
          class="register-button"
          (click)="irARegistro()">

          Registrarse

        </ion-button>

      </div>

    </div>
</ion-content>
