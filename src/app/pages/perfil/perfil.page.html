
<ion-content [fullscreen]="true" class="perfil-content">

  <div class="pantalla-perfil">

    <!-- Encabezado superior -->
    <div class="etiqueta-superior">
      CUENTA / MI PERFIL
    </div>

    <div class="barra-estado">
      <span>10:24</span>
      <div class="estado-iconos">
        <ion-icon name="cellular"></ion-icon>
        <ion-icon name="wifi"></ion-icon>
        <ion-icon name="battery-full"></ion-icon>
      </div>
    </div>

    <!-- Barra de navegación -->
    <div class="navbar">
      <ion-button fill="clear" class="icono-menu">
        <ion-icon name="menu-outline"></ion-icon>
      </ion-button>

      <h1>Mi perfil</h1>

      <ion-button fill="clear" class="icono-carrito">
        <ion-icon name="cart-outline"></ion-icon>
      </ion-button>
    </div>

    <!-- Información del usuario -->
    <div class="usuario">
      <div class="avatar">
        <ion-icon name="person-outline"></ion-icon>
      </div>

      <h2>{{ nombre }}</h2>
      <p>Alumno · Datos de ejemplo</p>
    </div>

    <!-- Formulario -->
    <div class="formulario">

      <div class="campo">
        <label>Nombre completo</label>
        <div class="input-contenedor">
          <ion-input
            [(ngModel)]="nombre"
            placeholder="Nombre completo">
          </ion-input>
        </div>
      </div>

      <div class="campo">
        <label>Correo electrónico</label>
        <div class="input-contenedor correo">
          <ion-icon name="mail-outline"></ion-icon>

          <ion-input
            [(ngModel)]="correo"
            type="email"
            placeholder="Correo electrónico">
          </ion-input>
        </div>
      </div>

      <!-- Destino escolar -->
      <div class="tarjeta-destino">

        <h3>Destino escolar habitual</h3>

        <div class="fila-destino">

          <div class="campo-destino">
            <label>Edificio</label>
            <div class="input-contenedor">
              <ion-input
                [(ngModel)]="edificio"
                placeholder="B">
              </ion-input>
            </div>
          </div>

          <div class="campo-destino">
            <label>Salón</label>
            <div class="input-contenedor">
              <ion-input
                [(ngModel)]="salon"
                placeholder="204">
              </ion-input>
            </div>
          </div>

        </div>

        <p>Puedes cambiarlo al confirmar cada pedido.</p>

      </div>

      <!-- Botones -->
      <ion-button
        expand="block"
        class="btn-guardar"
        (click)="guardarCambios()">
        Guardar cambios
      </ion-button>

      <ion-button
        expand="block"
        fill="outline"
        class="btn-password"
        (click)="cambiarPassword()">
        Cambiar contraseña
      </ion-button>

    </div>

  </div>

</ion-content>
